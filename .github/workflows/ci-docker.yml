name: CI and Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Block source-rewriting APPLY scripts and large base64 blobs
        run: |
          set -euo pipefail
          bad=$(git ls-files '*_APPLY.py' '*APPLY*.py' 'SYNC_LATEST_APPLY.py' 2>/dev/null || true)
          if [ -n "${bad}" ]; then
            echo "::error::Source-rewriting APPLY scripts must not be committed:"
            echo "${bad}"
            exit 1
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -gt 50000 ]; then
              hits=$(grep -oE '[A-Za-z0-9+/]{80,}={0,2}' "$f" | wc -l | tr -d ' ')
              if [ "$hits" -gt 5 ]; then
                echo "::error::$f looks like a base64-payload APPLY script (size=$size long_b64_runs=$hits)"
                exit 1
              fi
            fi
          done < <(git ls-files '*.py')
      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py' | grep -v '^alembic/')
      - name: Test
        run: python -m pytest -q tests

  docker:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Stable channel (latest / stable / semver) moves only on v*.*.* tags.
          # Continuous / testing channel (main / edge) updates on every push to main.
          # SHA tags are always produced for exact reproducibility.
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
