services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jsl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jira_support_library}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.12}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # SECURITY: do not publish Ollama to the host. The app reaches it on the
    # compose network at http://ollama:11434 only.
    expose:
      - "11434"

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.12}
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull $${OLLAMA_CHAT_MODEL:-llama3.2} || true
        ollama pull $${OLLAMA_EMBED_MODEL:-nomic-embed-text} || true
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  app:
    # Prefer a published image when APP_IMAGE is set (e.g. ghcr.io/thoubicimran/jira-support-library:stable).
    # Otherwise build from the local Dockerfile (dev default).
    image: ${APP_IMAGE:-jira-support-library:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OLLAMA_BASE: ${OLLAMA_BASE:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_SIMILARITY_THRESHOLD: ${AI_SIMILARITY_THRESHOLD:-0.82}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-180}
    # SECURITY: bind to loopback only. Put a TLS reverse proxy (Caddy/nginx)
    # in front for real access. Do not expose 8501 on 0.0.0.0 in production.
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
