services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jira_support}
      POSTGRES_USER: ${POSTGRES_USER:-jira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jira_user} -d ${POSTGRES_DB:-jira_support}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    # GPU (optional): uncomment if host has NVIDIA + nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export OLLAMA_HOST=http://ollama:11434
        echo "Waiting for Ollama at $$OLLAMA_HOST ..."
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -gt 60 ]; then echo "Timeout waiting for Ollama"; exit 1; fi
          sleep 3
        done
        echo "Pulling chat model: $${OLLAMA_CHAT_MODEL:-llama3.2}"
        ollama pull $${OLLAMA_CHAT_MODEL:-llama3.2}
        echo "Pulling embedding model: $${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull $${OLLAMA_EMBED_MODEL:-nomic-embed-text}
        echo "Models ready."
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (postgresql+psycopg://USER:PASSWORD@db:5432/DBNAME)}
      OLLAMA_BASE: ${OLLAMA_BASE:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_SIMILARITY_THRESHOLD: ${AI_SIMILARITY_THRESHOLD:-0.82}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-180}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
